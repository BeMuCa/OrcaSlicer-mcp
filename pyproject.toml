[project]
name = "orcaslicer-cli-mcp"
version = "0.1.0"
description = "MCP server that slices with the official, unmodified OrcaSlicer CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
orcaslicer-mcp = "orcaslicer_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orcaslicer_mcp"]
